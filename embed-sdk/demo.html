<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>marketing-chat-widget Demo (私域部署模式)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 40px;
      background: #f5f5f5;
    }
    h1 { color: #303133; }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
    }
    pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
      border-radius: 4px;
      overflow-x: auto;
    }
    .note { color: #909399; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>marketing-chat-widget Demo</h1>
    <p class="note">模拟"企业自有网站"，右下角浮标是嵌入的客服入口。私域部署模式：无需 AppKey。</p>

    <h2>嵌入方式（极简）</h2>
    <p>只需一行 &lt;script&gt; 标签：</p>
    <pre>&lt;script src="http://localhost:8204/embed/marketing-chat-widget.iife.js"&gt;&lt;/script&gt;</pre>

    <h2>当前 Demo 配置</h2>
    <ul>
      <li>API Base URL: <code>http://localhost:8204</code></li>
      <li>Channel ID: <code>default</code>（私域部署默认）</li>
    </ul>

    <p>点击右下角浮标即可与 AI 客服对话。</p>
  </div>

  <script src="http://localhost:8204/embed/marketing-chat-widget.iife.js"
    data-api-base-url="http://localhost:8204"></script>
</body>
</html>
