<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="wechat-enable-text-zoom-em" content="true">
    <title>{{.Title}}</title>
    <meta name="description" content="{{.Description}}">
    <meta property="og:title" content="{{.Title}}">
    <meta property="og:description" content="{{.Description}}">
    <meta property="og:image" content="{{.ImageURL}}">
    <meta property="og:url" content="{{.ShareURL}}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        .card-container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .share-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .card-image { width: 100%; height: 300px; object-fit: cover; }
        .card-content { padding: 20px; }
        .card-title { font-size: 20px; font-weight: 600; color: #333; margin-bottom: 10px; }
        .card-desc { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 20px; }
        .card-btn { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #07c160, #10b981); color: #fff; text-align: center; border-radius: 8px; font-size: 16px; font-weight: 500; text-decoration: none; }
        .card-btn:hover { opacity: 0.9; }
        .preview-tip { text-align: center; font-size: 12px; color: #999; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="share-card">
            <img class="card-image" src="{{.ImageURL}}" alt="{{.Title}}">
            <div class="card-content">
                <h1 class="card-title">{{.Title}}</h1>
                <p class="card-desc">{{.Description}}</p>
                <a class="card-btn" href="{{.RedirectURL}}" target="_blank">点击查看详情</a>
            </div>
        </div>
        <p class="preview-tip">点击右上角「···」分享给朋友</p>
    </div>
    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
    <script>
        wx.config({
            debug: false,
            appId: '{{.AppID}}',
            timestamp: '{{.Timestamp}}',
            nonceStr: '{{.NonceStr}}',
            signature: '{{.Signature}}',
            jsApiList: ['updateAppMessageShareData', 'updateTimelineShareData']
        });
        
        wx.ready(function() {
            wx.updateAppMessageShareData({
                title: '{{.Title}}',
                desc: '{{.Description}}',
                link: '{{.ShareURL}}',
                imgUrl: '{{.ImageURL}}'
            });
            
            wx.updateTimelineShareData({
                title: '{{.Title}}',
                link: '{{.ShareURL}}',
                imgUrl: '{{.ImageURL}}'
            });
        });
        
        wx.error(function(res) {
            console.error('微信JS-SDK初始化失败:', res);
        });
    </script>
</body>
</html>
