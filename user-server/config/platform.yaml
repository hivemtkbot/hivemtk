# 平台端地址
# 默认：线上平台端 API 网关 https://hivepaltformapi.xapptool.cn（开发/生产一致）
# 需求：hivemtk 初始化后直接将安装信息上报到该平台。
# 本地联调本地 platform-server 时可通过环境变量 PLATFORM_URL=http://localhost:8097 覆盖（见 LoadPlatform）。
api_url: "https://hivepaltformapi.xapptool.cn"
# 商户端密钥（32 位，与平台端配置一致）
# 私域合规基线 §7.2：通过环境变量 MERCHANT_API_SECRET 注入，禁止明文落库
secret: "${MERCHANT_API_SECRET}"
# 异步日志上报间隔（秒）
log_report_interval: 60
# 平台管理员账号（用于商户服务代理调用平台 /platform/* 路由）
admin_username: "admin"
# 私域合规基线 §7.2：管理员密码通过环境变量 ADMIN_PASSWORD 注入，禁止明文落库
# 部署时必须在 .env 或环境变量中设置 ADMIN_PASSWORD
admin_password: "${ADMIN_PASSWORD}"
