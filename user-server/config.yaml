platform_api:
  # 平台端 API 网关（user-server 跑在容器内，跨网络物理隔离）
  # 单一源：internal/config/ports.go → DefaultPlatformPort=8205
  # 文档源：DEVELOPMENT.md §2.4 + docker-compose.yml 中 platform-server 端口映射
  # 调整流程：先改 ports.go 常量 → 同步本字段 → 同步 docker-compose.yml
  # 覆盖优先级：环境变量 PLATFORM_API_URL > 本默认值
  # 字段名统一为 api_url（与 internal/config/platform.go LoadPlatform / server.go PlatformAPI 一致）
  api_url: "${PLATFORM_API_URL:http://host.docker.internal:8205}"

# 外部可达基座 URL（用于自动推导 Telegram / 飞书 / 钉钉等被动渠道的 Webhook 回调地址）
# 背景：user-server 部署在反代/frp/云函数之后，渠道回调所需的公网 URL
#       无法从「请求 Host 头」直接推断（默认会得到 localhost:8204，
#       Telegram 无法向其投递消息）。显式声明后，注册 webhook 时优先使用该地址。
# 覆盖优先级（自高到低）：
#   1. 环境变量 PUBLIC_BASE_URL（部署期单点覆盖，无需改文件）
#   2. 本字段 external.public_base_url
#   3. X-Forwarded-Proto / X-Forwarded-Host 反代透传
#   4. 请求自身 Host（仅适合公网直连调试）
# 格式要求：
#   - scheme + host（不含 path），如 https://shop.example.com 或 https://example.com:8443
#   - 必须是 https（Telegram / 飞书强制 https；本系统会自动把 http+端口 升级为 https）
#   - 不带尾部斜杠
# 留空 → 自动降级到 polling 模式（无需公网域名，但禁止水平扩展，仅适合开发 / 单实例）
external:
  public_base_url: "${PUBLIC_BASE_URL:}"

# 统一日志系统配置（生产建议 json + both，便于日志采集与本地排障）
logging:
  level: "info"
  format: "json"
  output: "both"
  file: "logs/user-server.log"
  max_size: 200
  component: "user-server"

database:
  type: postgres
  postgres:
    host: "${DB_HOST:mtk-postgres}"
    port: ${DB_PORT:8202}
    user: admin
    # 私域合规基线 §7.2：密码不落配置文件。docker 部署时由 docker-compose 的
    # env_file / 密钥管理注入 POSTGRES_PASSWORD，app 启动直接读取，
    # 配置文件不保留 password 字段。
    dbname: user_db
    sslmode: disable

vector_database:
  type: pgvector
  pgvector:
    table: knowledge_embeddings
    # 2026-07-24：本地 llama.cpp + bge-m3（1024 维），与 pgvector vector(1024) 对齐
    dimension: 1024

# 本地推理栈（embedding / rerank / llm）统一配置
# 设计详见 docs/architecture/HOST_INFERENCE_PLAN.md
# 三个能力走宿主机 llama.cpp（host.docker.internal），容器不再承载推理。
# 覆盖优先级：环境变量 > config > 默认
inference:
  profile: dev
  embedding:
    mode: local
    base_url: "${EMBEDDING_BASE_URL:http://host.docker.internal:8208/v1}"
    model: "bge-m3"
    dimension: 1024
    allow_fallback: false
  rerank:
    mode: local
    base_url: "${RERANK_BASE_URL:http://host.docker.internal:8209/v1}"
    model: "bge-reranker-v2-m3"
    enabled: true
  llm:
    mode: remote
    base_url: "${LLM_BASE_URL:http://host.docker.internal:8207/v1}"
    # 2026-08-10：切换为宿主机 MLX 栈 SmolLM3-3B 4bit（ModelScope 下载 + mlx_lm.convert，
    # 见 scripts/inference-host/mlx/），经 host.docker.internal:8207 直连。
    # 此前为 llama.cpp qwen2.5-7b-instruct GGUF；DB llm_providers（default 行）为运行时真相。
    model: "smollm3-3b-4bit-mlx"
    api_key: ""
    temperature: 0.7
    # 调优（2026-07-31 03:10）：1024 在 RAG 长答案上 finish_reason=length 截断，
    #   → orchestrator 判定低质量转人工（ai_replied=false）→ 客户端收到空回复。
    #   提到 2048 让 9B 完整输出一段含 RAG 引用的业务答案（实测首条 content_len=910，
    #   SOP + 知识库组合后普遍 1300-1700 token）。7B 同样适用。
    max_tokens: 2048
    # 调优记录（2026-07-30 → 2026-07-31 02:45）：
    #   - 300s 实测不够：9B + 完整 RAG 链路（intent + sop + 拟人润色）经常 250-300s，
    #     context canceled 后被判定为 LLM 失败，触发转人工（conf=0）
    #   - 提到 600s 适配 9B 长链路（单条最多 2-3 个 LLM 调用 × 60-150s）
    timeout_seconds: 600
    max_retries: 1
    # 主推理 provider：当前以云端 deepseek 为主（本地 default 作为兜底 fallback，本机 8207 未运行）。
    # 注意：provider 的 API 定义（api_key/base_url/model 等）现已持久化到数据库表 llm_providers，
    # 由后台「LLM路由」页面 / 脚本经 POST /api/llm/models 写入，容器启动经 LoadProvidersFromDB 加载，
    # 不再硬编码在配置中（合规基线：密钥不落配置文件）。本环境经脚本/页面注册了 deepseek（enabled）。
    primary_provider: deepseek

storage:
  type: qiniu
  qiniu:
    access_key: ""
    secret_key: ""
    bucket: ""
    domain: ""

# 多语言方案配置（v1.2 出海多语言 P1-2）
# 低资源语言（ar/th/vi/hi/tr）LLM 输出质量不稳定，启用后走 DeepL 翻译降级路径：
#   中文 RAG 生成 → DeepL 翻译 → Glossary 后处理校准
# 默认关闭：enabled=false 时不影响主流程，走标准跨语言 LLM 生成路径。
# 启用条件：enabled=true 且 DEEPL_API_KEY 环境变量已配置。
i18n:
  fallback:
    enabled: false                          # 总开关，默认关闭
    low_resource_langs: ["ar", "th", "vi", "hi", "tr"]  # 低资源语言列表
    translator: deepl                       # 翻译引擎（当前仅支持 deepl）
    deepl:
      # DeepL API key 通过环境变量注入（合规基线 §7.2 敏感数据脱敏）
      # 未设置时 FallbackBridge 自动禁用；Free 版需同步改 base_url 为 https://api-free.deepl.com/v2
      api_key: "${DEEPL_API_KEY}"
      base_url: "https://api.deepl.com/v2"
