platform_api:
  # 用户端/平台端网络物理隔离，跨容器不能用 platform-server 直连；
  # 与 docker-compose.yml 的 PLATFORM_API_URL 默认值保持一致（走宿主机网关，
  # 平台端容器已把 8205 映射到宿主机）。生产由 PLATFORM_API_URL 注入真实域名。
  base_url: "http://host.docker.internal:8205"

# 统一日志系统配置（生产建议 json + both，便于日志采集与本地排障）
logging:
  level: "info"
  format: "json"
  output: "both"
  file: "logs/user-server.log"
  max_size: 200
  component: "user-server"

database:
  type: postgres
  postgres:
    host: mtk-postgres
    port: 8202
    user: admin
    # 私域合规基线 §7.2：密码不落配置文件。docker 部署时由 docker-compose 的
    # env_file / 密钥管理注入 POSTGRES_PASSWORD，app 启动直接读取，
    # 配置文件不保留 password 字段。
    dbname: user_db
    sslmode: disable

vector_database:
  type: pgvector
  pgvector:
    table: knowledge_embeddings
    # 2026-07-24：本地 llama.cpp + bge-m3（1024 维），与 pgvector vector(1024) 对齐
    dimension: 1024

# 本地推理栈（embedding / rerank / llm）统一配置
# 设计详见 docs/architecture/HOST_INFERENCE_PLAN.md
# 三个能力默认走本地（mtk-embedding/mtk-rerank/mtk-llm，服务名在 mtk-inference-net 网络解析），
# 仅在 base_url+api_key 填线上地址时切到线上（OpenAI 兼容）。
# profile=dev：本机轻量档（Qwen2.5-3B-Instruct + bge-m3 + bge-reranker-v2-m3）；embedding 维度硬性 1024。
#
# ⚠️ 2026-07-24：本文件为【Docker 全栈部署】专用配置，user-server 容器内使用。
# 新部署请用 config.yaml（宿主机部署），仅当需要把 user-server 跑在容器内时才用本文件。
# 本文件保留目的是：旧部署升级时仍可继续运行（容器名 mtk-* 服务名解析在 mtk-inference-net 网络内仍有效）。
inference:
  profile: dev
  embedding:
    mode: local
    base_url: "http://mtk-embedding:8208/v1"   # 宿主机 llama.cpp（OpenAI 兼容 /v1/embeddings）
    model: "bge-m3"                            # dev 轻量档（1024 维，Xorbits/bge-m3-gguf Q4_K_M）
    dimension: 1024
    allow_fallback: false                       # 禁止静默降级 hash 伪向量（仅单测显式开启）
  rerank:
    mode: local
    base_url: "http://mtk-rerank:8209/v1"
    model: "bge-reranker-v2-m3"                # dev 轻量档（gaoshengwinner/bge-reranker-v2-m3-Q4_K_M-GGUF）
    enabled: true
  llm:
    mode: local
    base_url: "http://mtk-llm:8207/v1"          # 宿主机 llama.cpp（OpenAI 兼容 /v1/chat/completions）
    model: "Qwen2.5-1.5B-Instruct"               # dev 轻量档（Q4_K_M，与 .env LLM_MODEL_FILE 对齐）
    api_key: ""                                 # 本地模型无需密钥
    temperature: 0.7
    # 2026-07-24 性能优化：2048→1024。客服回复通常 <200 字（~300 token），
    # CPU 推理时间与生成 token 数近似线性，降 2 倍可省 ~50% 单次推理时间。
    max_tokens: 1024
    timeout_seconds: 90
    # 2026-07-24 性能优化：3→1。本地 LLM 失败多为进程崩溃/OOM，重试无意义。
    max_retries: 1
    cloud_providers: []                         # 本地优先；线上可选 fallback 见文档

storage:
  type: qiniu
  qiniu:
    access_key: ""
    secret_key: ""
    bucket: ""
    domain: ""

# 多语言方案配置（v1.2 出海多语言 P1-2）
# 低资源语言（ar/th/vi/hi/tr）LLM 输出质量不稳定，启用后走 DeepL 翻译降级路径：
#   中文 RAG 生成 → DeepL 翻译 → Glossary 后处理校准
# 默认关闭：enabled=false 时不影响主流程，走标准跨语言 LLM 生成路径。
# 启用条件：enabled=true 且 DEEPL_API_KEY 环境变量已配置。
i18n:
  fallback:
    enabled: false                          # 总开关，默认关闭
    low_resource_langs: ["ar", "th", "vi", "hi", "tr"]  # 低资源语言列表
    translator: deepl                       # 翻译引擎（当前仅支持 deepl）
    deepl:
      # DeepL API key 通过环境变量注入（合规基线 §7.2 敏感数据脱敏）
      # 未设置时 FallbackBridge 自动禁用；Free 版需同步改 base_url 为 https://api-free.deepl.com/v2
      api_key: "${DEEPL_API_KEY}"
      base_url: "https://api.deepl.com/v2"
