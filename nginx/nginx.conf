# ============================================================
# 中心反代（HTTPS）拓扑 —— 备选部署方案
# ------------------------------------------------------------
# 本文件是一套「独立 Nginx 反向代理」配置，用于用户端在云服务器上以
# 容器方式部署时做统一入口 + TLS 终止（user.example.com）。
#
# ⚠️ 与 docker-compose 拓扑的差异（部署前必须对齐）：
#   1. docker-compose 中 user-server 监听 8204，user-web 容器内监听 80；
#      本配置 upstream 写的是 dev 端口 8204 / 5173。
#      实际部署时 user-web 已在容器内嵌 nginx 监听 80，可直接对接 80。
#   2. docker-compose 未挂载/启动本 Nginx；如需启用反代，宿主机单独启动。
#   3. ssl/ 目录当前为空，需放入对应域名证书后方可启用 443 段。
# 如不使用本中心反代，可忽略此目录。
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50M;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 上游服务（用户端独立部署）
    upstream user_backend {
        least_conn;
        server user-server:8204 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream user_frontend {
        server user-web:80 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # ===================== 默认 HTTP -> HTTPS =====================
    server {
        listen 80 default_server;
        server_name _;

        # 健康检查
        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        # Let's Encrypt 验证
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其他全部重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===================== 商户端 (User / Merchant) =====================
    # 私域独立部署：仅暴露一个用户端域名（user.example.com）
    # 平台端不在本仓库部署，由用户端在 PLATFORM_API_URL 中以公网域名形式调用。
    server {
        listen 443 ssl http2;
        server_name user.example.com;

        ssl_certificate     /etc/nginx/ssl/user.example.com.crt;
        ssl_certificate_key /etc/nginx/ssl/user.example.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 商户端前端
        location / {
            proxy_pass http://user_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 商户端 API
        location /api/ {
            proxy_pass http://user_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            client_max_body_size 50M;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # WebSocket（客服 / 实时通知）
        location /ws/ {
            proxy_pass http://user_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # 网页客服浮标脚本（embed-sdk 产物由 user-server 直接服务，本路径为兼容旧部署）
        location /embed/ {
            proxy_pass http://user_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
