# =============================================================================
# 本地推理栈（统一编排）—— 三个本地模型服务，统一 mtk-* 命名、统一网络
# -----------------------------------------------------------------------------
# 1) mtk-llm      —— 对话/改写/摘要（llama.cpp，OpenAI 兼容 /v1/chat/completions）
# 2) mtk-embedding—— 向量化（TEI + BAAI/bge-m3，1024 维，OpenAI 兼容 /v1/embeddings）
# 3) mtk-rerank   —— 精排（TEI + BAAI/bge-reranker-v2-m3，OpenAI 兼容 /v1/rerank）
#
# 设计决策：
#   - embedding/rerank 采用 TEI 而非 llama.cpp GGUF：bge-m3 固定 1024 维、无离线降级。
#   - 三服务统一挂到 mtk-inference-net（name: mtk_inference_net）。用户端
#     docker-compose.yml 通过 external 网络接入，user-server 用服务名直接访问。
#   - 镜像：llm 用 ghcr.io/ggml-org/llama.cpp:server；embedding/rerank 用
#     ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest。
#   - mtk-embedding / mtk-rerank 的模型由宿主机 ./models 目录卷挂载（safetensors）。
#
# 一键启停（须先于用户端启动，以创建 mtk-inference-net 网络）：
#   make inference-up        # 拉起三容器
#   make inference-down      # 停止并保留模型
# =============================================================================

x-llama-common: &llama-common
  image: ghcr.io/ggml-org/llama.cpp:server
  entrypoint: ["/bin/bash", "/scripts/entrypoint.sh"]
  volumes:
    - ./models:/models
    - ./scripts/inference:/scripts:ro
  restart: unless-stopped
  networks: [mtk-inference-net]

networks:
  mtk-inference-net:
    name: mtk_inference_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.0.0/16

services:
  # ---------------------------------------------------------------------------
  # 1) LLM —— 对话 / 改写 / 摘要（OpenAI 兼容 chat/completions）
  # ---------------------------------------------------------------------------
  mtk-llm:
    <<: *llama-common
    container_name: mtk-llm
    environment:
      ROLE: llm
      MODELS_DIR: /models/llm
      MODEL_REPO: ${LLM_MODEL_REPO:-Qwen/Qwen2.5-14B-Instruct-GGUF}
      MODEL_FILE: ${LLM_MODEL_FILE:-qwen2.5-14b-instruct