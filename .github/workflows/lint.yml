# Lint：golangci-lint（Go）+ ESLint（前端 Bridge 扩展）
# 文档: https://golangci-lint.run/usage/install/

name: Lint

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: user-server
          args: --timeout=5m

  eslint:
    name: ESLint (Bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-web/bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: user-web/bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  arch-check:
    name: 五层架构检查
    # OPT-CI-07：与 user-server-ci.yml 重复，但保留为防御层
    # 原因：lint.yml 在仓库根目录运行，user-server-ci.yml 在 user-server 子目录
    # 两处都能捕获到架构违规，互为冗余防御
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check architecture
        run: |
          if [ -f scripts/check-architecture.sh ]; then
            bash scripts/check-architecture.sh
          else
            echo "scripts/check-architecture.sh 不存在，跳过"
          fi
