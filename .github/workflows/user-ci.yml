# GitHub Actions CI for hivemtk (user-server 商户端 + user-web)
# 触发：push / pull_request 作用于 master / main 分支
name: user-ci

on:
  push:
    branches: [master, main]
    paths:
      - 'user-server/**'
      - 'user-web/**'
      - '.github/workflows/user-ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'user-server/**'
      - 'user-web/**'
      - '.github/workflows/user-ci.yml'

jobs:
  user-server-test:
    name: Build & Test (user-server)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: user_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d user_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_HOST: 127.0.0.1
      POSTGRES_TEST_PORT: 5432
      POSTGRES_TEST_USER: admin
      POSTGRES_TEST_PASSWORD: password123
      POSTGRES_TEST_DBNAME: user_db_test
      # 私域基线 §7.2：测试期允许 hash embedding 降级
      EMBEDDING_ALLOW_FALLBACK: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: user-server/go.sum

      - name: go mod download
        working-directory: user-server
        run: go mod download

      - name: go vet
        working-directory: user-server
        run: go vet ./...

      - name: go build
        working-directory: user-server
        run: go build ./...

      - name: Run unit tests
        working-directory: user-server
        run: go test ./... -count=1 -timeout 600s -p 1

  user-web-build:
    name: Build (user-web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: user-web/package-lock.json

      - name: npm ci
        working-directory: user-web
        run: npm ci

      - name: Build
        working-directory: user-web
        run: npm run build
