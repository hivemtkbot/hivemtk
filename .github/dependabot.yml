# 文档: https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/user-server"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    open-pull-requests-limit: 5
    groups:
      go-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      go-major:
        applies-to: version-updates
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/user-web/bridge"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "bridge"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 3
