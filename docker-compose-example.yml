# ============================================================
# HivemTK 用户端 - Docker Compose（独立部署单元）
#
# 部署定位（2026-07-21 重构）：
#   - 本文件包含【用户端】全部组件：PostgreSQL(user_db) + Redis + user-server
#     + 本地推理栈（mtk-llm / mtk-embedding / mtk-rerank）。
#   - 用户端由各商户/用户自行部署，与【平台端】物理隔离。
#   - 前端（user-web）与嵌入 SDK（embed-sdk）在【宿主机】构建后挂载到容器。
#
# 所有容器统一 mtk- 前缀，服务名即容器名：
#   - mtk-postgres：PostgreSQL(user_db) + pgvector，容器内端口 8202（宿主机映射 8232）
#   - mtk-redis：Redis 7 缓存，端口 8203
#   - mtk-user-server：user-server (Go + Gin)，端口 8204
#   - mtk-llm：llama.cpp（Qwen2.5-1.5B-Instruct），OpenAI 兼容 /v1/chat/completions，端口 8207
#   - mtk-embedding：TEI + Qwen3-Embedding-0.6B（Candle 后端，1024 维），OpenAI 兼容 /v1/embeddings，端口 8208
#   - mtk-rerank：TEI + bge-reranker-base，OpenAI 兼容 /v1/rerank，端口 8209
#
# 平台端连通：
#   - mtk-user-server 通过 PLATFORM_API_URL 调用平台端。
#
# 启动顺序（模型加载较慢，建议先起推理栈）：
#   make inference-up   # 先拉起三推理服务（创建 mtk_inference_net）
#   make up             # 再启动业务栈接入同一网络
# 或一次性全部启动：docker compose -f docker-compose.yml up -d
# 停止：docker compose -f docker-compose.yml down
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"
    labels: "service,environment"

x-llama-common: &llama-common
  image: ghcr.io/ggml-org/llama.cpp:server
  entrypoint: ["/bin/bash", "/scripts/entrypoint.sh"]
  volumes:
    - ./models:/models
    - ./scripts/inference:/scripts:ro
  restart: unless-stopped
  networks: [mtk-inference-net]

networks:
  mtk-user-network:
    name: mtk_user_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16
  mtk-inference-net:
    name: mtk_inference_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.0.0/16

volumes:
  # PG 数据用绑定挂载到本地目录 ./pg_data（已加入 .gitignore，运维可直接备份/恢复）
  mtk_user_redis_data:
    name: mtk_user_redis_data
  mtk_user_logs:
    name: mtk_user_logs
  mtk_user_uploads:
    name: mtk_user_uploads
  mtk_user_data:
    name: mtk_user_data

services:
  # 用户端 PostgreSQL 15+ + pgvector（独立容器，库名 user_db）
  mtk-postgres:
    image: pgvector/pgvector:pg15
    container_name: mtk-postgres
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (use: openssl rand -hex 24)}"
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
    command:
      - postgres
      - -c
      - shared_preload_libraries=vector,pg_stat_statements
      - -c
      - max_connections=500
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - port=8202
    ports:
      - "${USER_POSTGRES_HOST_PORT:-8232}:8202"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./migrations/init-user-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      mtk-user-network:
        aliases:
          - mtk-postgres
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-admin} -d ${USER_DB_NAME:-user_db} -p 8202
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Redis 缓存
  mtk-redis:
    image: redis:7-alpine
    container_name: mtk-redis
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - redis-server
      - --port
      - "8203"
      - --appendonly
      - "yes"
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_HOST_PORT:-8203}:8203"
    volumes:
      - mtk_user_redis_data:/data
    networks:
      mtk-user-network:
        aliases:
          - mtk-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "8203", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================================
  # 用户端服务
  # ============================================================
  mtk-user-server:
    build:
      context: ./user-server
      dockerfile: Dockerfile
    image: mtk/user-server:${TAG:-latest}
    container_name: mtk-user-server
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      GIN_MODE: ${GIN_MODE:-release}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8204
      # 用户端数据库（独立容器 mtk-postgres，容器内端口 8202）
      DB_HOST: mtk-postgres
      DB_PORT: 8202
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (use: openssl rand -hex 24)}"
      DB_NAME: ${USER_DB_NAME:-user_db}
      # Redis
      REDIS_HOST: mtk-redis
      REDIS_PORT: 8203
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      # 强制 JWT_SECRET 必填
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required (>=32 chars). Generate with: openssl rand -hex 32}"
      JWT_EXPIRE: ${JWT_EXPIRE:-24h}
      # 平台端地址
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://host.docker.internal:8205}
      PLATFORM_LICENSE_SECRET: "${PLATFORM_LICENSE_SECRET:?PLATFORM_LICENSE_SECRET is required (>=32 chars). Generate with: openssl rand -hex 32}"
      # install.lock 持久化
      INSTALL_LOCK_PATH: /app/data/install.lock
      # 七牛云存储
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
      QINIU_BUCKET: ${QINIU_BUCKET:-}
      QINIU_DOMAIN: ${QINIU_DOMAIN:-}
      # 邮箱
      QQ_NUMBER: ${QQ_NUMBER:-}
      QQ_EMAIL: ${QQ_EMAIL:-}
      QQ_EMAIL_PASSWORD: ${QQ_EMAIL_PASSWORD:-}
      EMAIL_163_USER: ${EMAIL_163_USER:-}
      EMAIL_163_PASSWORD: ${EMAIL_163_PASSWORD:-}
      EMAIL_163_SMTP_HOST: ${EMAIL_163_SMTP_HOST:-smtp.163.com}
      # CORS
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS_USER:-https://user.example.com}
      # LLM（默认走本地推理栈 mtk-llm；LLM_MODEL 是对外 API 的 model 字段，
      # 实际加载文件由 LLM_MODEL_FILE 决定）
      LLM_API_KEY: ${LLM_API_KEY:-local}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://mtk-llm:8207/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      # Embedding
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://mtk-embedding:8208/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen3-Embedding-0.6B}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_ALLOW_FALLBACK: ${EMBEDDING_ALLOW_FALLBACK:-false}
      # Rerank
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://mtk-rerank:8209}
      RERANK_MODEL: ${RERANK_MODEL:-bge-reranker-base}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      # 网页客服静态资源
      USER_WEB_DIST: /app/user-web-dist
      EMBED_SDK_DIST: /app/embed-sdk-dist
    env_file:
      - path: ./.env
        required: false
    ports:
      - "${USER_SERVER_PORT:-8204}:8204"
    volumes:
      - ./user-server/config-docker.yaml:/app/config.yaml:ro
      - mtk_user_logs:/app/logs
      - mtk_user_uploads:/app/uploads
      - mtk_user_data:/app/data
      - ./user-web/dist:/app/user-web-dist:ro
      - ./embed-sdk/dist:/app/embed-sdk-dist:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # user-server 二进制在容器内固定以 localhost:8202 连接数据库（配置解析后 host 为空，
      # pgx 默认回落到 localhost），此处把容器内的 localhost 指向 mtk-postgres 容器 IP
      - "localhost:172.32.0.2"
    shm_size: '2gb'
    depends_on:
      mtk-postgres:
        condition: service_healthy
      mtk-redis:
        condition: service_healthy
    networks:
      mtk-user-network:
        aliases:
          - mtk-user-server
      mtk-inference-net: {}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:8204/health &&
          curl -fsS http://mtk-embedding:8208/health >/dev/null 2>&1 &&
          curl -fsS http://mtk-rerank:8209/health >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

  # =============================================================================
  # 本地推理栈（mtk-*）—— 三个本地模型服务，统一网络 mtk-inference-net
  # -----------------------------------------------------------------------------
  # 1) mtk-llm      —— 对话/改写/摘要（llama.cpp，OpenAI 兼容 /v1/chat/completions）
  # 2) mtk-embedding—— 向量化（TEI + Qwen3-Embedding-0.6B，1024 维，OpenAI 兼容 /v1/embeddings）
  # 3) mtk-rerank   —— 精排（TEI + bge-reranker-base，OpenAI 兼容 /v1/rerank）
  #
  # 设计决策：
  #   - embedding/rerank 采用 TEI 而非 llama.cpp GGUF：bge 系固定 1024 维、无离线降级。
  #   - 镜像：llm 用 ghcr.io/ggml-org/llama.cpp:server；embedding/rerank 用
  #     ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest。
  #   - 模型由宿主机 ./models 目录卷挂载（safetensors / GGUF）。
  #   - Qwen3-Embedding-0.6B（Candle 后端）warmup 内存占用大，已限制
  #     --max-concurrent-requests / --max-batch-tokens 并设 8G 内存上限防 OOM。
  #
  # 一键启停：
  #   make inference-up      # 拉起三容器
  #   make inference-down    # 停止并保留模型
  # =============================================================================

  # ---------------------------------------------------------------------------
  # 1) LLM —— 对话 / 改写 / 摘要（OpenAI 兼容 chat/completions）
  # ---------------------------------------------------------------------------
  mtk-llm:
    <<: *llama-common
    container_name: mtk-llm
    networks:
      mtk-inference-net:
        aliases:
          - mtk-llm
    environment:
      ROLE: llm
      MODELS_DIR: /models/llm
      MODEL_REPO: ${LLM_MODEL_REPO:-Qwen/Qwen2.5-1.5B-Instruct-GGUF}
      MODEL_FILE: ${LLM_MODEL_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-Qwen2.5-1.5B-Instruct}
      MODEL_BRANCH: master
      DOWNLOAD_SOURCE: ${LLM_DOWNLOAD_SOURCE:-modelscope,hf-mirror,hf}
      CONTEXT_SIZE: "8192"
      THREADS: "0"
    ports:
      - "8207:8207"
    deploy:
      resources:
        limits:
          cpus: "4"
          # 1.5B Q4 ≈ 1.1GB 常驻 + KV cache；14B 需 6G+
          memory: ${LLM_MEM_LIMIT:-1.5G}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8207'"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 120s

  # ---------------------------------------------------------------------------
  # 2) Embedding —— 向量化（TEI + 1024 维；默认 dev 档 Qwen3-Embedding-0.6B）
  # ---------------------------------------------------------------------------
  mtk-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest
    container_name: mtk-embedding
    command:
      - --model-id=${EMBEDDING_MODEL_ID:-/data/Qwen3-Embedding-0.6B}
      - --served-model-name=${EMBEDDING_SERVED_NAME:-Qwen3-Embedding-0.6B}
      - --hostname=0.0.0.0
      - --port=8208
      # 极小批处理，降低 Candle Qwen3-0.6B warmup 时的内存占用
      - --max-concurrent-requests=1
      - --max-batch-tokens=512
    environment:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    volumes:
      - ./models:/data:ro
    networks:
      mtk-inference-net:
        aliases:
          - mtk-embedding
    ports:
      - "8208:8208"
    deploy:
      resources:
        limits:
          cpus: "2"
          # Qwen3-Embedding-0.6B 走 Candle 后端，warmup 需 ~7-8G
          memory: ${EMBEDDING_MEM_LIMIT:-8G}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8208'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ---------------------------------------------------------------------------
  # 3) Rerank —— 精排（TEI + bge-reranker-base）
  # ---------------------------------------------------------------------------
  mtk-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest
    container_name: mtk-rerank
    command:
      - --model-id=${RERANK_MODEL_ID:-/data/bge-reranker-base}
      - --served-model-name=${RERANK_SERVED_NAME:-bge-reranker-base}
      - --hostname=0.0.0.0
      - --port=8209
    environment:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    volumes:
      - ./models:/data:ro
    networks:
      mtk-inference-net:
        aliases:
          - mtk-rerank
    ports:
      - "8209:8209"
    deploy:
      resources:
        limits:
          cpus: "2"
          # bge-reranker-base dev 档（278M 参数，~1.1GB safetensors）需 ~1G
          memory: ${RERANK_MEM_LIMIT:-1G}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8209'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
