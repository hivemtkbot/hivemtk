server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源 — 强缓存（构建产物带 hash，永不变）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # version.json — 不缓存（前端用来探测新 build）
    location = /version.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # service worker — 不缓存
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API 代理 → user-server:8204
    location /api/ {
        proxy_pass http://user-server:8204  # 生产环境用实际 user-server 地址;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
    }

    # embed-sdk iframe 代理 → user-server bridge
    location /bridge/ {
        proxy_pass http://user-server:8204  # 生产环境用实际 user-server 地址;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback（hash history 其实不需要，但兼容手动路径）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
