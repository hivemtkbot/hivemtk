# user-web 静态文件服务（nginx）
# 生产部署：先 npm run build，再 docker compose up
# 开发调试：直接用 vite dev server（8211）
services:
  user-web:
    image: nginx:alpine
    container_name: mtk-user-web
    restart: unless-stopped
    ports:
      - "8211:80"
    volumes:
      # 构建产物（vite build → dist/）
      - ../../user-web/dist:/usr/share/nginx/html:ro
      # nginx 配置（带 /api proxy_pass）
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hivemtk

networks:
  hivemtk:
    external: true
