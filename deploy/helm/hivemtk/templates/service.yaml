{{- /* user-server Service skeleton (OPT-MISC-01) */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-user-server
  labels:
    app: {{ .Chart.Name }}
    component: user-server
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    app: {{ .Chart.Name }}
    component: user-server
